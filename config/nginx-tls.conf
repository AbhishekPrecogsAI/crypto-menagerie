# nginx-tls.conf — TLS termination config with a mix of weak and strong.
# Expected CBOM: deprecated protocols (TLSv1, TLSv1.1), weak ciphers
# (3DES, RC4), alongside a modern TLS 1.3 suite. Config-file crypto inventory.

server {
    listen 443 ssl;
    server_name legacy.menagerie.test;

    ssl_certificate     /etc/nginx/certs/rsa1024-sha1.pem;   # weak 1024-bit / SHA-1
    ssl_certificate_key /etc/nginx/certs/rsa1024-sha1.key;

    # Deprecated protocols still enabled — flagged.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # Weak cipher suites (3DES / RC4) mixed with modern AEAD.
    ssl_ciphers 'DES-CBC3-SHA:RC4-SHA:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384';
    ssl_prefer_server_ciphers on;
}

server {
    listen 8443 ssl;
    server_name svc.menagerie.test;

    ssl_certificate     /etc/nginx/certs/ec-p256.pem;         # modern EC
    ssl_certificate_key /etc/nginx/certs/ec-p256.key;

    # Hardened: TLS 1.3 only.
    ssl_protocols TLSv1.3;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';
}
